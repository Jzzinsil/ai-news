  @media (prefers-reduced-motion: reduce) {

</style>

/* ========================================================= */
const TOPIC_LABEL = {
  "physical-ai": "PHYSICAL AI",
  "ai": "AI",
  "robotics": "ROBOTICS",
  "security": "SECURITY",
  "chips": "CHIPS"
};

const arrowSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M17 7H8M17 7v9"/></svg>';
const xSvg = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>';

function tagsHtml(topics) {
  return topics.map(t => '<span class="tag">' + TOPIC_LABEL[t] + '</span>').join('<span aria-hidden="true">·</span>');
}

function render(filter) {
  const show = item => filter === "all" || item.topics.includes(filter);

  const newsGrid = document.getElementById("newsGrid");
  const news = EDITION.news.filter(show);
  newsGrid.innerHTML = news.map(n => `
    <a class="card" href="${n.url}" target="_blank" rel="noopener noreferrer">
      <div class="card-meta"><span class="src">${n.source}</span><span aria-hidden="true">·</span>${tagsHtml(n.topics)}</div>
      <h3>${n.title}</h3>
      <p class="summary">${n.summary}</p>
      <span class="go">원문 보기 ${arrowSvg}</span>
    </a>`).join("") || '<div class="empty">이 토픽의 뉴스가 오늘은 없습니다.</div>';

  const socialGrid = document.getElementById("socialGrid");
  const social = EDITION.social.filter(show);
  socialGrid.innerHTML = social.map(s => `
    <a class="xcard" href="${s.url}" target="_blank" rel="noopener noreferrer">
      <div class="xhead">
        <span class="avatar" aria-hidden="true">${s.initials}</span>
        <span>
          <span class="xname">${s.name}</span><br>
          <span class="xhandle mono">${s.handle}</span>
        </span>
        <span class="xicon">${xSvg}</span>
      </div>
      <p class="xquote">“${s.quote}”</p>
      <p class="xctx">${s.context}</p>
    </a>`).join("") || '<div class="empty">이 토픽의 포스트가 오늘은 없습니다.</div>';

  const companyGrid = document.getElementById("companyGrid");
  const company = EDITION.company.filter(show);
  companyGrid.innerHTML = company.map(c => `
    <a class="ccard" href="${c.url}" target="_blank" rel="noopener noreferrer">
      <div class="chead">
        <span class="clogo" aria-hidden="true">${c.logo}</span>
        <span>
          <span class="cname">${c.company}</span><br>
          <span class="ctype">${c.type}</span>
        </span>
      </div>
      <h3>${c.title}</h3>
      <p class="summary">${c.summary}</p>
      <span class="go">발표 보기 ${arrowSvg}</span>
    </a>`).join("") || '<div class="empty">이 토픽의 발표가 오늘은 없습니다.</div>';
}

/* filter chips */
document.getElementById("filters").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
  chip.classList.add("on");
  render(chip.dataset.topic);
});

/* date labels */
(function () {
  const d = new Date(EDITION.date + "T00:00:00+09:00");
  const days = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
  const label = EDITION.date.replaceAll("-", ".") + " " + days[d.getDay()];
  document.getElementById("todayLabel").textContent = label;
  document.getElementById("editionLabel").textContent = "EDITION " + label + " KST";
})();

/* section nav active state */
const navLinks = document.querySelectorAll(".section-nav a");
const sections = [...document.querySelectorAll("main section")];
const io = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (en.isIntersecting) {
      navLinks.forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + en.target.id));
    }
  });
}, { rootMargin: "-30% 0px -60% 0px" });
sections.forEach(s => io.observe(s));

/* back to top */
const toTop = document.getElementById("toTop");
window.addEventListener("scroll", () => {
  toTop.classList.toggle("show", window.scrollY > 600);
}, { passive: true });
toTop.addEventListener("click", () => window.scrollTo({ top: 0 }));

render("all");
</script>
